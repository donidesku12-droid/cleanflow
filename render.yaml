# One-click deploy on Render: Dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: cleanflow
    runtime: node
    plan: starter            # needed for the persistent disk below (the free plan loses data on restart)
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_FILE
        value: /var/data/cleanflow.db
      # Optional integrations – fill in later in the Render dashboard:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
    disk:
      name: cleanflow-data
      mountPath: /var/data
      sizeGB: 1
